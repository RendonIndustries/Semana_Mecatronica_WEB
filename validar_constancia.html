<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Validar Constancia - Semana de Mecatrónica 2025 - UPIIZ IPN</title>
    <meta name="description" content="Valida la autenticidad de una constancia de la Semana de Mecatrónica 2025">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.css" rel="stylesheet">
    
    <!-- Estilos template IPN -->
    <link rel="stylesheet" type="text/css" href="https://www.ipn.mx/assets/files/main/css/style-template.css">
    
    <!-- Estilos componentes IPN -->
    <link rel="stylesheet" type="text/css" href="https://www.ipn.mx/assets/files/main/css/style.css">
    
    <style>
        :root {
            --ipn-guinda: #6A0032;
            --ipn-blanco: #FFFFFF;
        }
        
        .validacion-section {
            padding: 80px 0;
            min-height: 70vh;
        }
        
        .validacion-container {
            background: var(--ipn-blanco);
            border-radius: 15px;
            padding: 2.5rem;
            box-shadow: 0 10px 30px rgba(106, 0, 50, 0.1);
            margin-bottom: 2rem;
        }
        
        .hash-input {
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            padding: 15px 20px;
            font-size: 1.1rem;
            font-family: monospace;
            transition: all 0.3s ease;
        }
        
        .hash-input:focus {
            border-color: var(--ipn-guinda);
            box-shadow: 0 0 0 0.2rem rgba(106, 0, 50, 0.25);
        }
        
        .resultado-valido {
            background: #d4edda;
            border: 2px solid #28a745;
            border-radius: 10px;
            padding: 2rem;
            color: #155724;
        }
        
        .resultado-invalido {
            background: #f8d7da;
            border: 2px solid #dc3545;
            border-radius: 10px;
            padding: 2rem;
            color: #721c24;
        }
        
        .resultado-pendiente {
            background: #fff3cd;
            border: 2px solid #ffc107;
            border-radius: 10px;
            padding: 2rem;
            color: #856404;
        }
        
        .btn-validar {
            background: var(--ipn-guinda);
            color: var(--ipn-blanco);
            border: none;
            border-radius: 8px;
            padding: 0.75rem 2rem;
            font-weight: 600;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }
        
        .btn-validar:hover {
            background: #8B0040;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(106, 0, 50, 0.3);
        }
        
        .qr-scanner-container {
            margin-top: 2rem;
            text-align: center;
        }
        
        #video {
            width: 100%;
            max-width: 400px;
            border-radius: 10px;
            border: 2px solid #e0e0e0;
        }
    </style>
</head>
<body>
    <!-- Navbar Container -->
    <div id="navbar-container"></div>
    
    <!-- Contenido Principal -->
    <section class="validacion-section">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <h1 class="text-center mb-4" style="color: var(--ipn-guinda);">
                        <i class="fas fa-shield-alt me-2"></i>
                        Validar Constancia
                    </h1>
                    <p class="text-center text-muted mb-5">
                        Ingresa el código hash del QR o escanea el código QR de la constancia para validar su autenticidad
                    </p>
                    
                    <!-- Formulario de validación -->
                    <div class="validacion-container">
                        <div class="mb-4">
                            <label for="hashInput" class="form-label">
                                <i class="fas fa-key me-2"></i>Código Hash del QR
                            </label>
                            <input 
                                type="text" 
                                id="hashInput" 
                                class="form-control hash-input" 
                                placeholder="Ingresa el código hash o escanea el QR"
                                autocomplete="off"
                            >
                            <small class="form-text text-muted">
                                El código hash se encuentra en el código QR de la constancia
                            </small>
                        </div>
                        
                        <div class="text-center">
                            <button id="btnValidar" class="btn btn-validar">
                                <i class="fas fa-check-circle me-2"></i>Validar Constancia
                            </button>
                        </div>
                        
                        <!-- Opción de escanear QR -->
                        <div class="text-center mt-4">
                            <button id="btnEscanearQR" class="btn btn-outline-primary">
                                <i class="fas fa-qrcode me-2"></i>Escanear Código QR
                            </button>
                        </div>
                        
                        <div id="scannerContainer" class="qr-scanner-container" style="display: none;">
                            <video id="video" autoplay playsinline></video>
                            <canvas id="canvas" style="display: none;"></canvas>
                            <div class="mt-3">
                                <button id="btnCerrarScanner" class="btn btn-secondary">
                                    <i class="fas fa-times me-2"></i>Cerrar Escáner
                                </button>
                            </div>
                        </div>
                    </div>
                    
                    <!-- Loading -->
                    <div id="loading" class="text-center" style="display: none;">
                        <div class="spinner-border text-guinda" role="status">
                            <span class="visually-hidden">Validando...</span>
                        </div>
                        <p class="mt-3 text-muted">Validando constancia...</p>
                    </div>
                    
                    <!-- Resultado -->
                    <div id="resultado" style="display: none;"></div>
                </div>
            </div>
        </div>
    </section>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Librería para escanear QR (opcional, usando jsQR) -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    
    <!-- Navbar Script -->
    <script src="components/navbar.js"></script>
    
    <script>
        // Configurar navbar
        document.addEventListener('DOMContentLoaded', function() {
            if (document.getElementById('navbar-container')) {
                loadNavbar('constancias');
            }
        });
        
        const hashInput = document.getElementById('hashInput');
        const btnValidar = document.getElementById('btnValidar');
        const btnEscanearQR = document.getElementById('btnEscanearQR');
        const btnCerrarScanner = document.getElementById('btnCerrarScanner');
        const loading = document.getElementById('loading');
        const resultado = document.getElementById('resultado');
        const scannerContainer = document.getElementById('scannerContainer');
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        
        let scanning = false;
        let stream = null;
        
        // Validar al presionar Enter
        hashInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                validarConstancia();
            }
        });
        
        // Validar al hacer clic
        btnValidar.addEventListener('click', validarConstancia);
        
        // Función de validación
        async function validarConstancia() {
            const hash = hashInput.value.trim();
            
            if (!hash) {
                alert('Por favor, ingresa un código hash');
                return;
            }
            
            // Ocultar resultado anterior
            resultado.style.display = 'none';
            loading.style.display = 'block';
            
            try {
                const response = await fetch(`/api/constancias/validar?hash=${encodeURIComponent(hash)}`);
                const data = await response.json();
                
                loading.style.display = 'none';
                resultado.style.display = 'block';
                
                if (data.success && data.valida) {
                    // Constancia válida
                    resultado.className = 'resultado-valido';
                    resultado.innerHTML = `
                        <div class="text-center">
                            <i class="fas fa-check-circle fa-3x mb-3"></i>
                            <h3 class="mb-3">✅ Constancia Válida</h3>
                            <p class="mb-4">Esta constancia es auténtica y ha sido verificada.</p>
                            
                            <div class="card bg-white text-dark mt-4">
                                <div class="card-body text-start">
                                    <h5 class="card-title"><i class="fas fa-user me-2"></i>Información de la Constancia</h5>
                                    <hr>
                                    <p class="mb-2"><strong>Nombre:</strong> ${data.constancia.nombre}</p>
                                    <p class="mb-2"><strong>Actividad:</strong> ${data.constancia.actividad || 'No especificada'}</p>
                                    <p class="mb-2"><strong>Tipo:</strong> ${data.constancia.tipo === 'conferencias' ? 'Conferencia' : 'Taller'}</p>
                                    <p class="mb-0"><strong>Hash:</strong> <code>${hash}</code></p>
                                </div>
                            </div>
                            
                            <p class="mt-4 mb-0 text-muted small">
                                <i class="fas fa-clock me-1"></i>
                                Validada el ${new Date(data.fecha_validacion).toLocaleString('es-MX')}
                            </p>
                        </div>
                    `;
                } else {
                    // Constancia no válida
                    resultado.className = 'resultado-invalido';
                    resultado.innerHTML = `
                        <div class="text-center">
                            <i class="fas fa-times-circle fa-3x mb-3"></i>
                            <h3 class="mb-3">❌ Constancia No Válida</h3>
                            <p class="mb-0">${data.mensaje || 'La constancia no pudo ser validada. Verifica que el código hash sea correcto.'}</p>
                        </div>
                    `;
                }
            } catch (error) {
                loading.style.display = 'none';
                resultado.style.display = 'block';
                resultado.className = 'resultado-invalido';
                resultado.innerHTML = `
                    <div class="text-center">
                        <i class="fas fa-exclamation-triangle fa-3x mb-3"></i>
                        <h3 class="mb-3">Error de Validación</h3>
                        <p class="mb-0">No se pudo validar la constancia. Por favor, intenta nuevamente.</p>
                    </div>
                `;
                console.error('Error al validar:', error);
            }
        }
        
        // Escanear QR
        btnEscanearQR.addEventListener('click', iniciarScanner);
        btnCerrarScanner.addEventListener('click', detenerScanner);
        
        function iniciarScanner() {
            scannerContainer.style.display = 'block';
            scanning = true;
            
            navigator.mediaDevices.getUserMedia({ 
                video: { 
                    facingMode: 'environment' // Cámara trasera en móviles
                } 
            })
            .then(function(mediaStream) {
                stream = mediaStream;
                video.srcObject = stream;
                video.setAttribute('playsinline', true);
                video.play();
                
                // Iniciar detección de QR
                detectarQR();
            })
            .catch(function(error) {
                console.error('Error accediendo a la cámara:', error);
                alert('No se pudo acceder a la cámara. Asegúrate de dar permisos.');
                scannerContainer.style.display = 'none';
                scanning = false;
            });
        }
        
        function detenerScanner() {
            scanning = false;
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            video.srcObject = null;
            scannerContainer.style.display = 'none';
        }
        
        function detectarQR() {
            if (!scanning) return;
            
            if (video.readyState === video.HAVE_ENOUGH_DATA) {
                canvas.height = video.videoHeight;
                canvas.width = video.videoWidth;
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height);
                
                if (code) {
                    // Extraer hash de la URL
                    const url = code.data;
                    const hashMatch = url.match(/hash=([A-Z0-9]+)/i);
                    
                    if (hashMatch) {
                        const hash = hashMatch[1];
                        hashInput.value = hash;
                        detenerScanner();
                        validarConstancia();
                    } else {
                        // Si el QR contiene directamente el hash
                        hashInput.value = code.data;
                        detenerScanner();
                        validarConstancia();
                    }
                }
            }
            
            if (scanning) {
                requestAnimationFrame(detectarQR);
            }
        }
    </script>
</body>
</html>
